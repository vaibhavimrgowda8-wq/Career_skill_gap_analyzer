<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Details | CareerPath AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<section class="career-form">

    <h1>Complete Your Career Profile</h1>

    <p>Tell us about your education, skills and career goals.</p>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <p class="message">{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('career_details') }}">

        <label>Full Name</label>
        <input type="text" value="{{ session.name }}" readonly>

        <label>Education Level</label>
        <select name="education" required>
            <option value="">Select Education</option>
            <option value="School">School</option>
            <option value="Diploma">Diploma</option>
            <option value="Undergraduate">Undergraduate</option>
            <option value="Postgraduate">Postgraduate</option>
            <option value="Other">Other</option>
        </select>

        <label>Degree / Course</label>
        <input type="text" name="course"
               placeholder="Example: BCA, B.Tech, B.Sc" required>

        <label>Current Skills</label>
        <textarea name="skills"
                  placeholder="Example: Python, HTML, CSS, Java"
                  required></textarea>

        <small>Separate each skill with a comma.</small>

        <label>Desired Career</label>
        <select name="career" required>
            <option value="">Select Your Career</option>
            <option value="Software Developer">Software Developer</option>
            <option value="Web Developer">Web Developer</option>
            <option value="Data Scientist">Data Scientist</option>
            <option value="Data Analyst">Data Analyst</option>
            <option value="AI Engineer">AI Engineer</option>
            <option value="Cybersecurity Analyst">Cybersecurity Analyst</option>
        </select>

        <button type="submit">Save Profile</button>

    </form>

    <p>
        <a href="{{ url_for('profile') }}">Back to Profile</a>
    </p>

</section>

</body>
</html>
